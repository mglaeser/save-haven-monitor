<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="content-type" content="text/html; charset=utf-8">
<!-- Lay out at the widget's own point size (168) so WidgetWeb does NOT scale the page down. -->
<meta name="viewport" content="width=168, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- JsWidget (WidgetWeb) mandatory title -->
<meta name="js-widget-title" content="AI Bubble Monitor">
<title>AI Bubble Monitor — JS-Widget</title>
<style type="text/css">
  :root{
    --bg:#21252D; --text:#FFFFFF; --dim:#C6CCD6; --muted:#9BA4B2; --faint:#939CAA;
    --violet:#B79DFF; --line:rgba(255,255,255,0.07); --serif:Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg)}
  body{color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  /* Fixed 168x168 box == small 1:1 widget, authored at that size (no downscaling). Dense, no radial
     whitespace: a horizontal REGIME zone bar (blue/gold/red, marker) with a big score+band, an F&G
     zone bar, then a full metric grid + freshness. Every number fits; content clipped to the box. */
  .wrap{position:relative;width:168px;height:168px;overflow:hidden;margin:0 auto;padding:10px 12px 8px;
    display:flex;flex-direction:column;gap:7px}
  .glow{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(80% 60% at 50% 0%,rgba(183,157,255,0.12),rgba(183,157,255,0.03) 55%,transparent 78%)}
  .row{position:relative;z-index:1}
  /* Heads MUST stay one line: .wrap is a fixed 168px box with overflow:hidden, so a wrapped
     head steals a row from the layout and pushes .foot (freshness) out of the widget. nowrap makes
     that impossible; overflow+ellipsis+min-width:0 then degrades an over-long value gracefully
     (score 100 + DE-RISK, or an over-long F&G rating) instead of clipping mid-glyph. */
  .head{display:flex;justify-content:space-between;align-items:flex-end;gap:4px;margin-bottom:5px}
  .lab{font-size:8px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;flex:none}
  .score{font-family:var(--serif);font-size:30px;line-height:0.8;font-variant-numeric:tabular-nums;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .score .band{font-size:12px;letter-spacing:0.12em;margin-left:5px}
  .fgval{font-family:var(--serif);font-size:15px;font-variant-numeric:tabular-nums;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;text-align:right}
  .fgval .rating{font-size:8px;letter-spacing:0.02em;margin-left:3px}
  #fgblock .lab{letter-spacing:0.05em} /* 12-char label vs REGIME's 6 — buy width back for the rating */
  .bar{position:relative;height:9px;border-radius:999px}
  .bar.reg{background:linear-gradient(90deg,#29C7E8 0 45%,#B79DFF 45% 60%,#FF6B8A 60% 100%);opacity:0.9}
  .bar.fg{background:linear-gradient(90deg,#2E86E8,#29C7E8,#C6CCD6,#F08AA0,#FF6B8A)}  /* flipped */
  .mk{position:absolute;top:-3px;width:2.5px;height:15px;border-radius:2px;background:var(--text);
    box-shadow:0 0 0 2px var(--bg);transform:translateX(-50%)}
  .grid{display:grid;grid-template-columns:1fr 1fr;column-gap:10px;row-gap:3px;
    font-size:10.5px;line-height:1.2;color:var(--dim);font-variant-numeric:tabular-nums;position:relative;z-index:1;margin-top:1px}
  .grid .cell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grid .k{color:var(--muted)}
  .foot{font-size:8.5px;color:var(--muted);text-align:center;position:relative;z-index:1;
    font-variant-numeric:tabular-nums;margin-top:auto}
  .foot .badge{border:1px solid var(--line);border-radius:999px;padding:0 5px;text-transform:uppercase;letter-spacing:0.06em}
</style>
</head>
<body>
  <div class="wrap">
    <div class="glow"></div>
    <div class="row">
      <div class="head"><span class="lab">Regime</span>
        <span class="score" id="score">—</span></div>
      <div class="bar reg"><span class="mk" id="regmk"></span></div>
    </div>
    <div class="row" id="fgblock">
      <div class="head"><span class="lab">Fear &amp; Greed</span><span class="fgval" id="fgval">—</span></div>
      <div class="bar fg"><span class="mk" id="fgmk"></span></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="foot" id="foot"></div>
  </div>

<script type="text/javascript">
/* ============ WidgetWeb JS-Widget: AI Bubble Monitor (served from GitHub Pages) ============
   Self-contained, no external assets (30MB widget budget), STATELESS (no cookies / no local store).
   Authored at the widget's 168pt box (viewport width=168) so it is NOT scaled down. Dense horizontal
   layout: a REGIME zone bar (cyan/violet/rose) + big score+band, an F&G zone bar, and a full metric grid.
   Endpoint like the dashboard (DR-015): the API base is EMBEDDED — a fixed, KEY_RE-whitelisted subdomain
   label of the page's own parent domain, no query parameter. The SAMPLE state below is the static/default
   content; it is replaced only when the live API answers, and stays (badged "sample") when it does not. */

function __wweb2JsWidgetTitle(){ return "AI Bubble Monitor"; }
function __wweb2Log(m){ /* Developer-mode log hook */ }

/* ---- endpoint (mirrors src/bubblegauge.tsx resolveApiBase) ---- */
const KEY_RE = /^[a-z0-9-]{1,32}$/;               // strict whitelist — no dots, no full URLs
var SUB = "api";                                   // fixed API subdomain label — a fragment, never a host (IDENTICAL to the dashboard's)
function resolveBase(){ // reads nothing but the hostname (verify/tests/74 executes it)
  if (!KEY_RE.test(SUB)) return { live: false };                 // fail closed -> sample
  var host = String(window.location.hostname || "").toLowerCase();
  if (host.length > 1 && host.charAt(host.length - 1) === ".") host = host.slice(0, -1); // FQDN trailing dot
  if (host === "localhost" || host === "[::1]" || host === "0.0.0.0" || /^127\.\d+\.\d+\.\d+$/.test(host) || /\.local$/.test(host)) return { live: true, base: "http://localhost:8000" }; // dev
  var labels = host.split(".");
  if (labels[0] === "www" && labels.length === 3) labels.shift();
  var bad = labels.length !== 2 || host.charAt(0) === "[";
  for (var i = 0; i < labels.length && !bad; i++) if (!labels[i] || /^\d+$/.test(labels[i])) bad = true;
  if (bad) return { live: false };                                // only an apex (or www.apex) names the API -> else sample
  return { live: true, base: "https://" + SUB + "." + labels.join(".") }; // subdomain-of-apex only
}
var ACT = resolveBase();
var API_BASE = ACT.base || null;

/* ---- tokens ---- */
var BAND={hold:{label:"HOLD",color:"#29C7E8"},trim:{label:"TRIM",color:"#B79DFF"},"de-risk":{label:"DE-RISK",color:"#FF6B8A"},
  "suppressed (block degraded)":{label:"SUPPRESSED",color:"#9BA4B2"}}; // a withheld score must not read as HOLD
function bandOf(b){return BAND[b]||BAND.hold;}
var FG_COLORS={"extreme fear":"#FF6B8A","fear":"#F08AA0","neutral":"#C6CCD6","greed":"#29C7E8","extreme greed":"#2E86E8"};
var FG_RATINGS=["extreme fear","fear","neutral","greed","extreme greed"]; // same enum the dashboard validates against
function fgRating(r){return FG_RATINGS.indexOf(r)!==-1?r:null;} // array lookup: never reaches Object.prototype
var FG_SHORT={"extreme greed":"extr. greed","extreme fear":"extr. fear"}; // display-only: full rating still drives FG_COLORS
var OK="#29C7E8", ALERT="#FF6B8A"; // names track values (cyan / rose)

var SAMPLE={score:40,band:"hold",iqr:[34,47],redFlags:0,spy:"IN",qqq:"IN",
  fg:{value:46,rating:"neutral"},cape:42.2,goldTtm:22.9,btcDd:-44,asOf:"sample",
  scoreTrend:[37,39,40],fgTrend:[29,31,46]}; // last-3 OBSERVED snapshots (score history / F&G feed series) → V2 trend tails
var DATA=SAMPLE;

function span(cls,txt){var s=document.createElement("span");if(cls)s.className=cls;if(txt!=null)s.textContent=txt;return s;}
function cell(k,v,c){var d=span("cell");d.appendChild(span("k",k+" "));var e=span(null,v);if(c)e.style.color=c;d.appendChild(e);return d;}
function clamp(x){return Math.max(0,Math.min(100,x));}
function num(x){return typeof x==="number"&&isFinite(x);} // strict: rejects null (global isFinite coerces null->0)
/* V2 "Kielwasser" trend tail: a fading tail from the value 3 readings ago to the marker, in the
   direction of the move. Length grows with |change over the last 3 points|; a small sine wave is
   added only on a reversal (up-then-down / down-then-up), amplitude proportional to the overshoot.
   Drawn on top of the bar, undistorted (measured in real px). Removes itself when data is absent. */
function tail(barEl,pts,flip){
  if(!barEl) return;
  var old=barEl.querySelector("svg.tt"); if(old) old.parentNode.removeChild(old);
  if(!pts||pts.length!==3||!pts.every(num)) return;
  var color="#FFFFFF"; // white ink (= C.text), matches the dashboard's TrendTail — reads on every zone
  var W=barEl.clientWidth,H=barEl.clientHeight||9; if(!W) return;
  function xf(v){v=clamp(v);return ((flip?100-v:v)/100)*W;}
  var x0=xf(pts[0]),x2=xf(pts[2]),mlen=Math.abs(x2-x0); if(mlen<2) return;
  var dir=x2>=x0?1:-1,yc=H/2,a=pts[1]-pts[0],b=pts[2]-pts[1],rev=(a>0&&b<0)||(a<0&&b>0);
  var ov=Math.abs(pts[1]-(pts[0]+pts[2])/2),amp=rev?Math.min(H*0.4,ov*0.34):0,d;
  if(amp<0.4){ d="M"+x0.toFixed(1)+" "+yc+" L"+x2.toFixed(1)+" "+yc; }
  else { var n=30,len=mlen,hp=2.5; d=""; for(var i=0;i<=n;i++){var t=i/n,x=x0+dir*len*t,
    yy=yc+Math.sin(t*hp*Math.PI)*amp*(0.35+0.65*Math.sin(t*Math.PI)); d+=(i?" L":"M")+x.toFixed(1)+" "+yy.toFixed(1);} }
  var hh=Math.max(2.6,Math.min(H*0.5-0.5,4.4)),hl=Math.min(Math.max(4.5,Math.min(6.5,H*0.75)),mlen),gid="tt"+(flip?"f":"r"); // head never exceeds the move / the bar height
  var tipX=x2+dir*1.2,backX=tipX-dir*hl; // filled arrowhead leads at the marker, pointing forward
  var head="M"+tipX.toFixed(1)+" "+yc+" L"+backX.toFixed(1)+" "+(yc-hh).toFixed(1)+" L"+backX.toFixed(1)+" "+(yc+hh).toFixed(1)+" Z";
  var destColor=dir>0?"#FF6B8A":(flip?"#2E86E8":"#29C7E8"); // head = colour of the bar end it heads toward
  var ns="http://www.w3.org/2000/svg",svg=document.createElementNS(ns,"svg");
  svg.setAttribute("class","tt"); svg.setAttribute("width",W); svg.setAttribute("height",H);
  svg.setAttribute("style","position:absolute;inset:0;pointer-events:none;overflow:visible");
  var defs=document.createElementNS(ns,"defs"),g=document.createElementNS(ns,"linearGradient");
  g.setAttribute("id",gid); g.setAttribute("gradientUnits","userSpaceOnUse");
  g.setAttribute("x1",x0.toFixed(1)); g.setAttribute("y1","0"); g.setAttribute("x2",x2.toFixed(1)); g.setAttribute("y2","0");
  [["0","0.18"],["0.55","0.66"],["1","0.96"]].forEach(function(o){var st=document.createElementNS(ns,"stop");
    st.setAttribute("offset",o[0]); st.setAttribute("stop-color",color); st.setAttribute("stop-opacity",o[1]); g.appendChild(st);});
  defs.appendChild(g); svg.appendChild(defs);
  var p1=document.createElementNS(ns,"path"); p1.setAttribute("d",d); p1.setAttribute("fill","none");
  p1.setAttribute("stroke","url(#"+gid+")"); p1.setAttribute("stroke-width",Math.max(2.4,H*0.34).toFixed(1)); p1.setAttribute("stroke-linecap","round");
  var p2=document.createElementNS(ns,"path"); p2.setAttribute("d",head); p2.setAttribute("fill",destColor);
  p2.setAttribute("stroke",color); p2.setAttribute("stroke-width",Math.max(0.8,H*0.12).toFixed(2)); p2.setAttribute("stroke-linejoin","round");
  svg.appendChild(p1); svg.appendChild(p2);
  barEl.insertBefore(svg,barEl.firstChild); // behind the marker (.mk paints on top)
}
function render(){
  var d=DATA,b=bandOf(d.band);
  // regime: big score + band, marker on the zone bar
  var sc=document.getElementById("score"); sc.textContent="";
  sc.style.color=b.color;
  sc.appendChild(document.createTextNode(Math.round(d.score)));
  sc.appendChild(span("band",b.label));
  document.getElementById("regmk").style.left=clamp(d.score)+"%";
  // F&G (flipped bar; marker mirrored to 100 - value)
  var fgblock=document.getElementById("fgblock");
  if(d.fg&&num(d.fg.value)){
    fgblock.style.display="";
    var fv=document.getElementById("fgval");
    fv.textContent="";
    fv.appendChild(document.createTextNode(Math.round(d.fg.value*10)/10));
    var rt=fgRating(d.fg.rating); // off-enum -> no rating text, neutral colour (never a stale one)
    if(rt) fv.appendChild(span("rating",FG_SHORT[rt]||rt)); // small span, same shape as score+band
    fv.style.color=(rt&&FG_COLORS[rt])||"#C6CCD6";
    document.getElementById("fgmk").style.left=(100-clamp(d.fg.value))+"%";
  } else { fgblock.style.display="none"; }
  // dense metric grid — every remaining number
  var g=document.getElementById("grid"); g.textContent="";
  if(num(d.cape)) g.appendChild(cell("CAPE",Math.round(d.cape)+""));
  if(num(d.goldTtm)) g.appendChild(cell("Gold",(d.goldTtm>0?"+":"")+Math.round(d.goldTtm)+"%",OK));
  if(num(d.btcDd)) g.appendChild(cell("BTC",Math.round(d.btcDd)+"%",ALERT));
  // Guard BOTH bounds with num() before rounding — mirrors the dashboard's pair() (src/bubblegauge.tsx:275).
  // Math.round(null) is 0, so a null bound would otherwise print a fabricated "IQR 0–0" interval.
  if(Array.isArray(d.iqr)&&d.iqr.length===2&&num(d.iqr[0])&&num(d.iqr[1]))
    g.appendChild(cell("IQR",Math.round(d.iqr[0])+"–"+Math.round(d.iqr[1]))); // round like every other cell: live IQR is float
  if(num(d.redFlags)) g.appendChild(cell("Flags",d.redFlags+"/4",d.redFlags>0?"#B79DFF":OK));
  if(d.spy&&d.qqq){ var tc=(d.spy==="IN"&&d.qqq==="IN")?OK:(d.spy==="OUT"&&d.qqq==="OUT")?ALERT:"#B79DFF";
    g.appendChild(cell("Trend",d.spy+"·"+d.qqq,tc)); }
  // freshness / sample
  var foot=document.getElementById("foot"); foot.textContent="";
  if(d.asOf&&d.asOf!=="sample"){ foot.appendChild(document.createTextNode(rel(d.asOf))); }
  else { foot.appendChild(span("badge","sample")); foot.appendChild(document.createTextNode(" · heuristic, not advice")); }
  // V2 "Kielwasser" trend tails on both bars (regime + F&G), same encoding as the dashboard/splash.
  // Drawn in the marker's white ink so the tail reads on every zone (a zone-matched tail vanishes).
  tail(document.querySelector(".bar.reg"),d.scoreTrend,false);
  tail(document.querySelector(".bar.fg"),(d.fg&&num(d.fg.value))?d.fgTrend:null,true);
}
function rel(iso){
  var date=new Date(iso);if(!isFinite(date.getTime()))return String(iso);
  // Date's local getters intentionally use the visitor's/device's timezone.
  var now=new Date(),day=864e5;
  var dateDay=Date.UTC(date.getFullYear(),date.getMonth(),date.getDate());
  var todayDay=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
  var days=Math.round((todayDay-dateDay)/day);
  var time=(date.getHours()<10?"0":"")+date.getHours()+":"+(date.getMinutes()<10?"0":"")+date.getMinutes()+"h";
  if(days===0)return "today "+time;
  if(days===1)return "yesterday "+time;
  return date.toLocaleDateString(undefined,{day:"numeric",month:"short"})+" "+time;
}

/* ---- live fetch: the ONLY network call, to the constructed API_BASE; any failure keeps the sample ---- */
var LIVE_READY=!ACT.live;
if(ACT.live){
  var ctrl=("AbortController" in window)?new AbortController():null;
  if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},2600);
  var opt={headers:{accept:"application/json"},signal:ctrl&&ctrl.signal};
  Promise.all([
    fetch(API_BASE+"/api/v1/score",opt).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
    fetch(API_BASE+"/api/v1/dashboard/feed",opt).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
    fetch(API_BASE+"/api/v1/score/history?granularity=daily&limit=1000",opt).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
  ]).then(function(res){
    try{
      // Boundary validation (mirrors the dashboard's validScore): a 2xx body that is not a score
      // payload — no finite median, no band, no computed_at — keeps the SAMPLE, never a fabricated value.
      var env=res[0], sc=env&&env.data, mx=(res[1]&&res[1].data&&res[1].data.metrics)||{}, fg=mx.fear_greed, ts=sc&&sc.trend_states;
      var scOk=!!(sc&&num(sc.headline_median)&&typeof sc.action_band==="string"&&env.meta&&typeof env.meta.computed_at==="string");
      // last-3 regime medians from the history payload, re-anchored to end at the live score
      var hi=res[2]&&res[2].data, sT=null;
      if(Array.isArray(hi)&&hi.length>=3){ var mm=hi.slice(-3).map(function(r){return r&&num(r.median)?r.median:NaN;});
        if(mm.every(num)) sT=[mm[0],mm[1],num(sc&&sc.headline_median)?sc.headline_median:mm[2]]; }
      // F&G trend from OBSERVED snapshots: the feed's series (server-side-snapshotted history — the
      // same series the dashboard's history strip draws), re-anchored to the live reading. The CNN
      // previous_close/1_week/1_month REFERENCE fields are deliberately NOT used (owner decision).
      // Null-safe: null points skipped (never 0); < 3 observed points -> no arrow.
      var sfg=res[1]&&res[1].data&&res[1].data.series&&res[1].data.series.fear_greed, fT=null;
      if(sfg&&sfg.available&&Array.isArray(sfg.points)&&fg&&fg.available&&num(fg.value)){
        var vv=[]; for(var i=0;i<sfg.points.length;i++){var p=sfg.points[i]; if(p&&num(p.value)) vv.push(p.value);}
        if(vv.length>=3) fT=[vv[vv.length-3],vv[vv.length-2],fg.value];
      }
      if(scOk){
        DATA={score:sc.headline_median,band:sc.action_band,iqr:sc.iqr||null,redFlags:sc.red_flag_count,
          spy:ts&&ts.SPY&&ts.SPY.faber_10mo, qqq:ts&&ts.QQQ&&ts.QQQ.faber_10mo,
          fg:(fg&&fg.available&&num(fg.value))?{value:fg.value,rating:fg.detail&&fg.detail.rating}:null,
          cape:(mx.cape&&mx.cape.available)?mx.cape.value:NaN,
          goldTtm:(mx.gold_ttm_pct&&mx.gold_ttm_pct.available)?mx.gold_ttm_pct.value:NaN,
          btcDd:(mx.btc_drawdown_pct&&mx.btc_drawdown_pct.available)?mx.btc_drawdown_pct.value:NaN,
          scoreTrend:sT, fgTrend:fT,
          asOf:env.meta.computed_at}; // never invented: a payload without computed_at is not accepted above
        render();
      }
    }catch(e){__wweb2Log("map error "+e);}
    LIVE_READY=true;
  },function(){LIVE_READY=true;});
}
function __wweb2WaitMillisecondsToWidgetIsReady(currentDelayMs){
  return LIVE_READY ? 0 : (currentDelayMs < 3000 ? 400 : 0);
}

render();
</script>
</body>
</html>
